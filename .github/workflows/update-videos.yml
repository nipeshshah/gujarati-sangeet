name: Update videos.json

on:
  schedule:
    # 3:00 AM UTC every day — adjust the cron expression if you want a
    # different time. https://crontab.guru is handy for building these.
    - cron: "0 3 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit videos.json back

jobs:
  update-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch new videos from YouTube playlist
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_PLAYLIST_ID: ${{ secrets.YOUTUBE_PLAYLIST_ID }}
        run: node scripts/fetch-youtube-videos.mjs

      - name: Commit and push if videos.json changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- videos.json; then
            echo "No changes to commit."
          else
            git add videos.json
            git commit -m "Auto-update videos.json from YouTube playlist"
            git push
          fi
